pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

includeBuild('../CoFHCore') {
    dependencySubstitution {
        substitute module('com.teamcofh:cofh_core') using project(':')
    }
}
includeBuild('../ThermalCore') {
    dependencySubstitution {
        substitute module('com.teamcofh:thermal_core') using project(':')
    }
}

// Opt-in: -PwithDynamics loads ThermalDynamics in the dev runs.
if (providers.gradleProperty('withDynamics').isPresent()) {
    includeBuild('../ThermalDynamics') {
        dependencySubstitution {
            substitute module('com.teamcofh:thermal_dynamics') using project(':')
        }
    }
}

rootProject.name = 'ThermalExpansion'
